name: Build AnarchyOps

on:
  pull_request:
    branches: [main]
  push:
    branches: [anarchyops-build]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: anarchyops
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.0'

      - name: Build addon
        id: build
        continue-on-error: true
        run: |
          set -o pipefail
          gradle clean build --stacktrace 2>&1 | tee ../build.log

      - name: Prepare portable Gradle cache
        if: always()
        run: |
          rm -rf ../offline-gradle-home ../offline-gradle-project
          mkdir -p ../offline-gradle-home
          cp -a "$HOME/.gradle/caches" ../offline-gradle-home/
          cp -a "$HOME/.gradle/wrapper" ../offline-gradle-home/ || true
          cp -a .gradle ../offline-gradle-project || true
          find ../offline-gradle-home ../offline-gradle-project -name '*.lock' -delete 2>/dev/null || true

      - name: Upload output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: anarchyops-build
          if-no-files-found: warn
          path: |
            anarchyops/build/libs/**
            build.log

      - name: Upload offline Gradle cache
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: anarchyops-offline-gradle-cache
          compression-level: 0
          if-no-files-found: error
          path: |
            offline-gradle-home/**
            offline-gradle-project/**

      - name: Fail if build failed
        if: steps.build.outcome == 'failure'
        run: exit 1
